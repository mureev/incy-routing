name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  # The gate tests a committed snapshot of the upstream lists, so it cannot notice that the lists themselves
  # changed shape. The Monday canary builds from today's upstream and asks real Xray again.
  schedule:
    - cron: "0 6 * * 1"

# A newer push supersedes an older one, except on master, where pushes queue: cancelling could drop a commit
# that was green and already publishing. The event is in the key so the canary never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Read-only by default; `release` asks for packages: write on its own. Every action is pinned to a commit
# with its tag beside it (the same pins as mureev/weather; Dependabot moves them together).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

# bash -e -o pipefail for every run: step, so `pytest | tee` cannot hide a red suite behind tee's status.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: lint
        run: ruff check .
      - name: unit
        # No network: the upstream lists are a committed snapshot and the geo files are synthetic.
        # A skipped test is not a passing test, so any skip fails the job.
        run: |
          pytest -q -p no:randomly --strict-markers -rs | tee /tmp/unit.log
          if grep -qE '[0-9]+ skipped' /tmp/unit.log; then
            echo "::error::tests were skipped -- a skipped test is not a passing test"; exit 1
          fi

  routing:
    name: routing (real Xray)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The snapshot built with the real, pinned geo files and asked of the Xray core INCY ships: every case in
      # tests/routing must land where it says. Downloads are checked against pinned SHA-256s.
      - run: tools/routing_check.sh

  image:
    name: image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Built once, for the server's platform, and handed to `release` as is: what ships is what was checked.
      - name: build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: incy-routing:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_BUILD=${{ github.sha }}
            APP_BUILT_AT=${{ steps.built.outputs.at }}
          outputs: type=docker,dest=/tmp/incy-routing.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker load -i /tmp/incy-routing.tar
      # Started the way the server runs it (read-only root, no capabilities), offline against the snapshot.
      # It must build all three profiles, serve them, and report this commit as its build.
      - name: the image builds the profiles and serves them
        run: |
          mkdir -p /tmp/data && python3 tests/geodata.py /tmp/data/geo >/dev/null && chmod -R a+rwX /tmp/data
          docker run -d --name app -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v /tmp/data:/data \
            -v "$PWD/tests/fixtures/upstream:/mirror:ro" -e INCY_MIRROR=/mirror -e INCY_GEO_REFRESH=0 \
            incy-routing:ci
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:8080/blocked-only.json && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          for slug in ru-direct blocked-only sr-geo-literal; do
            curl -fsS "http://127.0.0.1:8080/$slug.json" | python3 -c "import json,sys; print(sys.argv[1], json.load(sys.stdin)['Name'])" "$slug"
          done
          curl -fsS http://127.0.0.1:8080/status | tee /tmp/status.json
          grep -q "\"$GITHUB_SHA\"" /tmp/status.json || { echo "::error::/status does not report this commit"; exit 1; }
          grep -q '"last_error": null' /tmp/status.json || { echo "::error::the build inside the image failed"; exit 1; }
      - name: container log
        if: failure()
        run: docker logs app || true
      - name: hand the checked image to release
        if: github.repository == 'mureev/incy-routing' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: /tmp/incy-routing.tar
          retention-days: 1

  # Delivery. When everything above passes on a push to master, the checked image is published as :master and
  # :sha-<short>. The server polls :master, deploys a new digest behind a health check through its reverse
  # proxy, and rolls back by itself if the check fails. Nothing here holds a credential for the server.
  release:
    name: publish image
    needs: [test, routing, image]
    if: github.repository == 'mureev/incy-routing' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/incy-routing.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish
        run: |
          for tag in master "sha-${GITHUB_SHA::7}"; do
            docker tag incy-routing:ci "ghcr.io/mureev/incy-routing:$tag"
          done
          docker push --all-tags ghcr.io/mureev/incy-routing

  # Not part of the gate, and never run by a push: today's upstream and the latest geo files, against the same
  # routing cases. Red here means the lists or the geo data moved, which may be fine; read it, then update the
  # snapshot (tests/fixtures/upstream), the pins in tools/routing_check.sh, or the cases.
  canary:
    name: upstream unchanged
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: LIVE=1 tools/routing_check.sh
